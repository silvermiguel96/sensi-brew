<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#09090b" />
    <meta
      name="description"
      content="SensiBrew — perfiles sensoriales, estadísticas vitales y maridajes gastronómicos de estilos cerveceros según la guía BJCP 2021. PWA que funciona sin internet."
    />
    <meta
      name="keywords"
      content="BJCP 2021, cerveza artesanal, guía de estilos cerveza, cata de cerveza, maridaje cervecero, IBU, SRM, ABV, estilos cerveceros"
    />
    <meta name="author" content="SensiBrew" />

    <!-- Open Graph / Redes Sociales y Motores -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SensiBrew" />
    <meta property="og:title" content="SensiBrew — Guía Sensorial de Estilos BJCP 2021" />
    <meta
      property="og:description"
      content="Perfiles sensoriales, estadísticas vitales (IBU, SRM, ABV), radar de intensidades y maridajes gastronómicos según la guía oficial BJCP 2021."
    />
    <meta property="og:image" content="/icons/icon.svg" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SensiBrew — Guía Sensorial BJCP 2021" />
    <meta
      name="twitter:description"
      content="Perfiles sensoriales, estadísticas vitales y maridajes gastronómicos de estilos cerveceros según la guía BJCP 2021."
    />
    <meta name="twitter:image" content="/icons/icon.svg" />

    <!-- Datos Estructurados JSON-LD (Schema.org) para motores de búsqueda e IAs -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "SensiBrew",
        "url": "https://sensibrew.app",
        "description": "Guía sensorial de estilos cerveceros BJCP 2021 con estadísticas vitales, radares de intensidad y maridajes gastronómicos.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "All",
        "inLanguage": "es",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SensiBrew" />
    <title>SensiBrew — Guía sensorial BJCP 2021</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
